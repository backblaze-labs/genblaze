[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genblaze-litellm"
version = "0.1.0"
description = "LiteLLM provider adapters for genblaze (image, speech, video, chat across 100+ providers)"
authors = [{name = "genblaze contributors"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Software Development :: Libraries",
]
keywords = ["genblaze", "litellm", "image", "video", "tts", "media", "provenance", "gateway"]
dependencies = [
    # >=0.3.9: chat(retry_on_rate_limit=True) relies on 0.3.9's
    # call_with_rate_limit_retry 5xx handling (#264), same as genblaze-openai.
    "genblaze-core>=0.3.9,<0.4",
    # LiteLLM's image_generation / speech / video_generation APIs; the range
    # is the one this connector is tested against (both ends).
    "litellm>=1.97.0,<1.106.0",
]

[project.urls]
Homepage = "https://github.com/backblaze-labs/genblaze"
Documentation = "https://github.com/backblaze-labs/genblaze"
Repository = "https://github.com/backblaze-labs/genblaze"
Issues = "https://github.com/backblaze-labs/genblaze/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.entry-points."genblaze.providers"]
litellm-image = "genblaze_litellm:LiteLLMImageProvider"
litellm-speech = "genblaze_litellm:LiteLLMSpeechProvider"
litellm-video = "genblaze_litellm:LiteLLMVideoProvider"

[tool.hatch.build.targets.wheel]
packages = ["genblaze_litellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
